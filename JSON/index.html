<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie log</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>Movie log</h1>
    <p id="count">Current movies: 0 </p>
    <form id="movie-form">

        <label for="title">Title</label>
        <input type="text" id="title">

        <label for="director">Director</label>
        <input type="text" id="director">
        
        <label for="review">Review</label>
        <textarea id="review"></textarea>

        <button id="add-movie" type="submit">Submit</button>

    </form>

    <p id="error"></p>
    <div id="buttons">
        <button id="list-button">Show all movies</button>
        <section id="all-movies">
            <button id="remove-last-button">Remove last</button>
        <button id="title-button">Show titles</button>
    </div>


    </section>
    <script src="script.js"></script>
</body>
</html>
