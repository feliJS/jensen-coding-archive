<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="calendar">
        <nav class="top-month">
            <span class="arrow">&#8592;</span>
                <div class="month-year-text">
                    <h1>September</h1>
                    <p>2020</p>
                </div>
            <span class="arrow">&#8592;</span>
        </nav>
        <section id="days">
            <aside id="day-1">Monday</aside>
            <aside id="day-2">Tuesday</aside>
            <aside id="day-3">Wednesday</aside>
            <aside id="day-4">Thursday</aside>
            <aside id="day-5">Friday</aside>
            <aside id="day-6">Saturday</aside>
            <aside id="day-7">Sunday</aside>
        </section>
        <section id="month-days">
        </section>
    </section>
    <script src="script.js"></script>
</body>
</html>
